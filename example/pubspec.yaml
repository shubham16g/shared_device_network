name: shared_device_network_example
description: "Printer hub: share Bluetooth printers with every phone on the Wi-Fi, using shared_device_network."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
    
  # Runs the printer hub in an Android foreground service (keeps Wi-Fi awake, restarts on boot).
  flutter_foreground_task: ^11.0.3
  # Bluetooth Classic (SPP) link to the printer; works inside the background service.
  flutter_classic_bluetooth: ^1.7.4

  shared_device_network:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
